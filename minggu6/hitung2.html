<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Nilai - Eksternal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-success-subtle">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card border-success-subtle shadow-sm">
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="text-center mb-0">Hitung Nilai Mahasiswa</h4>
                        <p class="text-center mb-0 small">
                            JavaScript Eksternal
                        </p>
                    </div>

                    <div class="card-body p-4">
                        <form id="formNilai">

                            <div class="mb-3">
                                <label for="nama" class="form-label">
                                    Nama Mahasiswa
                                </label>
                                <input type="text" class="form-control" id="nama" name="nama"
                                    placeholder="Masukkan nama mahasiswa" required>
                            </div>

                            <div class="mb-3">
                                <label for="tugas" class="form-label">
                                    Nilai Tugas
                                </label>
                                <input type="number" class="form-control" id="tugas" name="tugas" min="0" max="100"
                                    step="any" placeholder="0 - 100" required>
                            </div>

                            <div class="mb-3">
                                <label for="uts" class="form-label">
                                    Nilai UTS
                                </label>
                                <input type="number" class="form-control" id="uts" name="uts" min="0" max="100"
                                    step="any" placeholder="0 - 100" required>
                            </div>

                            <div class="mb-4">
                                <label for="uas" class="form-label">
                                    Nilai UAS
                                </label>
                                <input type="number" class="form-control" id="uas" name="uas" min="0" max="100"
                                    step="any" placeholder="0 - 100" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">
                                    Hitung Nilai
                                </button>
                                <button type="reset" class="btn btn-outline-success">
                                    Reset
                                </button>
                            </div>
                        </form>

                        <div id="hasil" class="alert alert-success mt-4 d-none" aria-live="polite">
                            <h5 class="mb-3">Hasil Perhitungan</h5>
                            <p class="mb-1">Nama: <strong id="hasilNama"></strong></p>
                            <p class="mb-1">Nilai Tugas: <span id="hasilTugas"></span></p>
                            <p class="mb-1">Nilai UTS: <span id="hasilUTS"></span></p>
                            <p class="mb-1">Nilai UAS: <span id="hasilUAS"></span></p>
                            <hr>
                            <p class="mb-1">Nilai Akhir:
                                <strong id="nilaiAkhir"></strong>
                            </p>
                            <p class="mb-1">Nilai Huruf:
                                <strong id="nilaiHuruf"></strong>
                            </p>
                            <p class="mb-0">Status:
                                <strong id="keterangan"></strong>
                            </p>
                        </div>
                    </div>
                </div>

                <p class="text-center text-success-emphasis mt-3 small">
                    Program Perhitungan Nilai Mahasiswa
                </p>

            </div>
        </div>
    </div>

    <!-- Memanggil JavaScript eksternal -->
    <script src="js/hitung_nilai.js"></script>

</body>

</html>
