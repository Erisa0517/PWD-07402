<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Nilai - Internal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-success-subtle">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card border-success-subtle shadow-sm">
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="text-center mb-0">Hitung Nilai Mahasiswa</h4>
                    </div>

                    <div class="card-body p-4">
                        <form onsubmit="event.preventDefault(); hitungNilai();">

                            <div class="mb-3">
                                <label for="nama" class="form-label">
                                    Nama Mahasiswa
                                </label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama mahasiswa"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="tugas" class="form-label">
                                    Nilai Tugas
                                </label>
                                <input type="number" class="form-control" id="tugas" min="0" max="100" step="any"
                                    placeholder="0 - 100" required>
                            </div>

                            <div class="mb-3">
                                <label for="uts" class="form-label">
                                    Nilai UTS
                                </label>
                                <input type="number" class="form-control" id="uts" min="0" max="100" step="any"
                                    placeholder="0 - 100" required>
                            </div>

                            <div class="mb-4">
                                <label for="uas" class="form-label">
                                    Nilai UAS
                                </label>
                                <input type="number" class="form-control" id="uas" min="0" max="100" step="any"
                                    placeholder="0 - 100" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Hitung Nilai
                            </button>
                        </form>

                        <div id="hasil" class="alert alert-success mt-4 d-none" aria-live="polite"></div>
                    </div>
                </div>

                <p class="text-center text-success-emphasis mt-3 small">
                    Program Perhitungan Nilai Mahasiswa
                </p>

            </div>
        </div>
    </div>

    <!-- JavaScript internal -->
    <script>
        function hitungNilai() {
            // Mengambil input dari HTML
            const xnama = document.getElementById("nama").value.trim();
            const ytugas = Number(document.getElementById("tugas").value);
            const yuts = Number(document.getElementById("uts").value);
            const yuas = Number(document.getElementById("uas").value);

            if (xnama === "") {
                alert("Nama mahasiswa harus diisi!");
                return;
            }

            if (
                document.getElementById("tugas").value === "" ||
                document.getElementById("uts").value === "" ||
                document.getElementById("uas").value === ""
            ) {
                alert("Semua nilai harus diisi!");
                return;
            }

            if (
                ytugas < 0 || ytugas > 100 ||
                yuts < 0 || yuts > 100 ||
                yuas < 0 || yuas > 100
            ) {
                alert("Nilai harus antara 0 sampai 100!");
                return;
            }

            // Menghitung nilai akhir sesuai kode dosen
            let nilaiAkhir =
                (ytugas * 0.30) +
                (yuts * 0.30) +
                (yuas * 0.40);

            // Menentukan nilai huruf
            let nilaiHuruf;

            if (nilaiAkhir >= 85) {
                nilaiHuruf = "A";
            } else if (nilaiAkhir >= 75) {
                nilaiHuruf = "B";
            } else if (nilaiAkhir >= 65) {
                nilaiHuruf = "C";
            } else if (nilaiAkhir >= 50) {
                nilaiHuruf = "D";
            } else {
                nilaiHuruf = "E";
            }

            // Menentukan status kelulusan
            let status;

            if (nilaiAkhir >= 60) {
                status = "Lulus";
            } else {
                status = "Tidak Lulus";
            }

            // Menampilkan hasil
            document.getElementById("hasil").innerHTML = `
                <h5 class="mb-3">Hasil Perhitungan</h5>
                <p class="mb-1">Nama: <strong>${xnama}</strong></p>
                <p class="mb-1">Nilai Tugas: ${ytugas}</p>
                <p class="mb-1">Nilai UTS: ${yuts}</p>
                <p class="mb-1">Nilai UAS: ${yuas}</p>
                <hr>
                <p class="mb-1">Nilai Akhir:
                    <strong>${nilaiAkhir.toFixed(2)}</strong>
                </p>
                <p class="mb-1">Nilai Huruf:
                    <strong>${nilaiHuruf}</strong>
                </p>
                <p class="mb-0">Status:
                    <strong>${status}</strong>
                </p>
            `;

            document.getElementById("hasil").classList.remove("d-none");
        }
    </script>

</body>

</html>
